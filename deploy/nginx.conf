# Nginx snippet for CloudPanel (Sites → benihindonesia.org → Vhost).
# Paste these directives inside the HTTPS `server { ... }` block.
# Do NOT add a second `location / { }` — edit the existing one instead.

# Clean URLs: /about/ is served from about/index.html (Astro build output)
absolute_redirect off;
index index.html;
error_page 404 /404.html;

# Old .html URLs → new clean URLs (permanent, keeps search rankings).
# $request_uri is used for index.html because `index` does an internal
# redirect to /index.html, which a `location = /index.html` would loop on.
if ($request_uri = /index.html) {
    return 301 /;
}
location ~ ^/(about|programmes|impact|stories|resources|contact|get-involved)\.html$ {
    return 301 /$1/;
}

# Replace the body of the existing `location / { }` with:
#     try_files $uri $uri/ =404;

# Astro assets have hashed file names, so they can be cached for a year
location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
